<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — Loopable8</title>
  <meta name="description" content="Sign in to your Loopable8 account to manage your license, downloads and settings." />
  <link rel="canonical" href="https://foxzyduckzy.github.io/signin.html" />
  <meta name="robots" content="noindex,follow" />
  <script>
    (function(){try{var t=localStorage.getItem("lo8_theme");if(!t)t=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";document.documentElement.setAttribute("data-theme",t);}catch(e){}})();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%23101013'/><path d='M12 12c-2-2.67-4-4-6-4a4 4 0 1 0 0 8c2 0 4-1.33 6-4Zm0 0c2 2.67 4 4 6 4a4 4 0 0 0 0-8c-2 0-4 1.33-6 4Z' fill='none' stroke='white' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
</head>
<body data-page="signin">
<a class="skip-link" href="#main">Skip to content</a>
<div class="shell">

  <main id="main">
    <div class="auth-wrap">
      <div class="auth-card">
        <svg class="logo-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 12c-2-2.67-4-4-6-4a4 4 0 1 0 0 8c2 0 4-1.33 6-4Zm0 0c2 2.67 4 4 6 4a4 4 0 0 0 0-8c-2 0-4 1.33-6 4Z"/></svg>
        <h1>Welcome back</h1>
        <p class="auth-sub">Sign in to manage your license, downloads and settings.</p>

        <div class="form-error-box" id="signinError" role="alert"></div>

        <div class="oauth-row">
          <button type="button" class="btn-oauth" data-oauth="google">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.84 14.1a6.6 6.6 0 0 1 0-4.2V7.06H2.18a11 11 0 0 0 0 9.88l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1A11 11 0 0 0 2.18 7.06l3.66 2.84C6.71 7.31 9.14 5.38 12 5.38z"/></svg>
            Google
          </button>
          <button type="button" class="btn-oauth" data-oauth="github">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M12 1a11 11 0 0 0-3.48 21.44c.55.1.75-.24.75-.53v-1.86c-3.06.67-3.7-1.47-3.7-1.47-.5-1.28-1.23-1.62-1.23-1.62-1-.68.08-.67.08-.67 1.1.08 1.68 1.14 1.68 1.14.98 1.68 2.57 1.2 3.2.92.1-.71.38-1.2.7-1.47-2.44-.28-5-1.22-5-5.44 0-1.2.43-2.18 1.13-2.95-.11-.28-.49-1.4.11-2.91 0 0 .92-.3 3.02 1.13a10.5 10.5 0 0 1 5.5 0c2.1-1.43 3.02-1.13 3.02-1.13.6 1.51.22 2.63.11 2.91.7.77 1.13 1.75 1.13 2.95 0 4.23-2.57 5.15-5.02 5.43.39.34.74 1 .74 2.02v3c0 .29.2.64.75.53A11 11 0 0 0 12 1z"/></svg>
            GitHub
          </button>
        </div>
        <div class="auth-divider">or</div>

        <form id="signinForm" novalidate>
          <div class="form-field">
            <label for="siEmail">Email</label>
            <input class="input" id="siEmail" name="email" type="email" autocomplete="email" placeholder="you@email.com" required />
            <p class="field-error" data-error-for="siEmail">Please enter a valid email address.</p>
          </div>
          <div class="form-field">
            <label for="siPassword">Password</label>
            <div class="pw-wrap">
              <input class="input" id="siPassword" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required />
              <button type="button" class="pw-toggle" aria-pressed="false">Show</button>
            </div>
          </div>
          <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top:8px;">Sign in</button>
        </form>

        <p class="auth-alt">New to Loopable8? <a href="signup.html">Create an account</a></p>
        <p class="auth-note">Your Loopable8 web account is the same account you use in the desktop app. Subscriptions and credits are managed inside the app.</p>
      </div>
    </div>
  </main>

  <script src="js/layout.js"></script>
  <script type="module" src="js/supabase-auth.js"></script>
</div>
</body>
</html>
