<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Request form</title>

    <!--
      A .dc.html artifact. Generated from artifacts/form.mjs — edit that,
      then run `npm run artifacts`.

      Three rules make the format work:
        1. It renders correctly on its own, from disk, with no host.
        2. It declares its own controls; the host builds the props bar from them.
        3. It owns its own arithmetic and layout logic.
    -->
    <script type="application/dc-props+json">
    {
          "accent": {
                "type": "select",
                "label": "accent",
                "default": "Indigo",
                "options": [
                      "Indigo",
                      "Forest",
                      "Oxide",
                      "Ink"
                ]
          },
          "showBudget": {
                "type": "boolean",
                "label": "showBudget",
                "default": true
          },
          "showSignature": {
                "type": "boolean",
                "label": "showSignature",
                "default": true
          },
          "formCode": {
                "type": "text",
                "label": "formCode",
                "default": "LO8-ANIM-01"
          }
    }
    </script>

    <style>
      :root {
        --ink: #17171a;
        --ink-soft: #55555c;
        --ink-faint: #8a8a92;
        --rule: #e2e2e6;
        --paper: #ffffff;

        --accent: #4a5fbf;
        }

      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        background: var(--paper);
        color: var(--ink);
        font-family: Inter, system-ui, -apple-system, sans-serif;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
      }

      .page {
        width: 794px;
        min-height: 1123px;
        margin: 0 auto;
        padding: 56px 60px;
        display: flex;
        flex-direction: column;
      }

      /* Editable regions have to be findable before they are clicked, or the
         reader hunts for what the mode changed. */
      html[data-editing='true'] [data-editable] {
        outline: 1px dashed color-mix(in srgb, var(--accent) 45%, transparent);
        outline-offset: 3px;
        border-radius: 2px;
        cursor: text;
      }
      html[data-editing='true'] [data-editable]:hover { outline-style: solid; }
      html[data-editing='true'] [data-editable]:focus {
        outline: 2px solid var(--accent);
        background: color-mix(in srgb, var(--accent) 7%, transparent);
      }
      html[data-editing='true'] [data-editable]:empty::before {
        content: attr(data-placeholder);
        color: var(--ink-faint);
      }

      @media print {
        .page { width: auto; min-height: 0; padding: 0; }
      }

      html[data-accent='Forest'] { --accent: #1d6b4f; }
      html[data-accent='Oxide']  { --accent: #9a4a24; }
      html[data-accent='Ink']    { --accent: #17171a; }

      .page { font-size: 12.5px; }

      header { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; }
      h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; }
      .who { margin-top: 4px; color: var(--ink-soft); font-size: 12px; }
      .code {
        padding: 5px 10px;
        border: 1px solid var(--accent);
        border-radius: 6px;
        color: var(--accent);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.06em;
        white-space: nowrap;
      }

      .rule { height: 2px; background: var(--accent); margin: 22px 0 26px; }

      fieldset { border: 0; margin-bottom: 24px; }
      legend {
        font-size: 9.5px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 12px;
      }

      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 24px; }
      .full { grid-column: 1 / -1; }

      /* A printed form: the "field" is a labelled rule, because this is a document
         someone fills in, not a web form that submits anywhere. */
      .f label {
        display: block;
        font-size: 9.5px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ink-faint);
        margin-bottom: 5px;
      }
      .f .line {
        min-height: 22px;
        border-bottom: 1px solid var(--rule);
        color: var(--ink);
        padding-bottom: 2px;
      }
      .f .line:empty::after { content: ' '; }

      html:not([data-show-budget='true']) .budget { display: none; }
      html:not([data-show-signature='true']) .sign-row { display: none; }

      .choices { display: flex; flex-wrap: wrap; gap: 10px 18px; }
      .choice { display: flex; align-items: center; gap: 7px; color: var(--ink-soft); }
      .box { width: 13px; height: 13px; border: 1.5px solid var(--ink-faint); border-radius: 3px; flex: none; }
      .choice[data-on='true'] .box { background: var(--accent); border-color: var(--accent); }

      .note { margin-top: 8px; color: var(--ink-faint); font-size: 11px; font-style: italic; }

      .sign-row { margin-top: auto; padding-top: 48px; display: flex; gap: 56px; }
      .sign { flex: 1; }
      .sign .rule-thin { height: 1px; background: var(--ink); opacity: 0.35; }
      .sign p {
        margin-top: 6px;
        font-size: 9.5px;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--ink-faint);
      }
  
    </style>
  </head>

  <body>
    <div class="page">
      <header>
        <div>
          <h1 data-field="projectName" data-editable>Animation request</h1>
          <p class="who" data-field="projectNote" data-editable>
            Loopable8 Studio · Motion Graphics
          </p>
        </div>
        <span class="code" data-prop="formCode">LO8-ANIM-01</span>
      </header>

      <div class="rule"></div>

      <fieldset>
        <legend>Requester</legend>
        <div class="grid">
          <div class="f"><label>Name</label><div class="line" data-editable data-placeholder=" "></div></div>
          <div class="f"><label>Organisation</label><div class="line" data-editable data-placeholder=" "></div></div>
          <div class="f"><label>Email</label><div class="line" data-editable data-placeholder=" "></div></div>
          <div class="f"><label>Phone</label><div class="line" data-editable data-placeholder=" "></div></div>
        </div>
      </fieldset>

      <fieldset>
        <legend>The work</legend>
        <div class="grid">
          <div class="f full"><label>What is it for</label><div class="line" data-editable data-placeholder=" "></div></div>
          <div class="f"><label>Delivery date</label><div class="line" data-editable data-placeholder=" "></div></div>
          <div class="f"><label>Final format</label><div class="line" data-editable data-placeholder=" "></div></div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Type</legend>
        <div class="choices">
          <span class="choice" data-on="true"><span class="box"></span><span data-editable>LED backdrop</span></span>
          <span class="choice"><span class="box"></span><span data-editable>Title sequence</span></span>
          <span class="choice"><span class="box"></span><span data-editable>Social cut</span></span>
          <span class="choice"><span class="box"></span><span data-editable>3D / product</span></span>
          <span class="choice"><span class="box"></span><span data-editable>Other</span></span>
        </div>
      </fieldset>

      <fieldset class="budget">
        <legend>Budget</legend>
        <div class="grid">
          <div class="f"><label>Range</label><div class="line" data-editable data-placeholder=" "></div></div>
          <div class="f"><label>Approved by</label><div class="line" data-editable data-placeholder=" "></div></div>
        </div>
        <p class="note" data-field="terms" data-editable>
          A quotation follows within two working days of this form being received.
        </p>
      </fieldset>

      <div class="sign-row">
        <div class="sign"><div class="rule-thin"></div><p>Requested by</p></div>
        <div class="sign"><div class="rule-thin"></div><p>Received by</p></div>
      </div>
    </div>
    <script>
      /**
       * The shared .dc.html runtime.
       *
       * Every artifact needs the same five things: apply props, apply patches, be
       * editable, restore an exported state, and answer the host's readiness ping.
       * Writing that six times would mean six chances for one of them to drift — and
       * the drift would be invisible, because each artifact only fails on its own page.
       *
       * It is inlined into each file rather than linked, because rule one of the
       * format is that an artifact renders on its own from disk with no host and no
       * network. A shared <script src> would break exactly that.
       *
       * An artifact that needs more — the quotation derives totals from its lines —
       * defines `window.DC_HOOKS = { render, patch }` before this runs.
       */
      (function () {
        var props = {};
        var editing = false;
        var committed = new Map();
        var hooks = window.DC_HOOKS || {};
      
        function kebab(s) {
          return s.replace(/([a-z0-9])([A-Z])/g, '$1-$2').toLowerCase();
        }
      
        function editableNodes() {
          return Array.prototype.slice.call(document.querySelectorAll('[data-editable]'));
        }
      
        function render() {
          // Any element bound to a prop shows that prop's value.
          document.querySelectorAll('[data-prop]').forEach(function (el) {
            var key = el.getAttribute('data-prop');
            if (typeof props[key] === 'string') el.textContent = props[key];
          });
          if (hooks.render) hooks.render(props);
          report();
        }
      
        function applyProps(next) {
          Object.keys(next).forEach(function (k) {
            props[k] = next[k];
            document.documentElement.setAttribute('data-' + kebab(k), String(next[k]));
          });
          render();
        }
      
        function setCommitted(el, value) {
          if (committed.has(el)) committed.set(el, value);
        }
      
        function applyPatch(ops) {
          (ops || []).forEach(function (op) {
            if (op.op === 'setProp') {
              props[op.key] = op.value;
              document.documentElement.setAttribute('data-' + kebab(op.key), String(op.value));
            } else if (op.op === 'setField') {
              var el = document.querySelector('[data-field="' + op.field + '"]');
              if (el) {
                el.textContent = op.value;
                setCommitted(el, op.value);
              }
            } else if (hooks.patch) {
              hooks.patch(op, { setCommitted: setCommitted });
            }
          });
          render();
        }
      
        // ── Edit mode ──
        //
        // The baseline is taken when edit mode opens, not on focus. Keying it to a
        // focus event means any path into a field that does not fire one leaves
        // nothing to compare against, and the blur handler discards what was typed.
      
        function snapshot() {
          committed.clear();
          editableNodes().forEach(function (el) {
            committed.set(el, el.textContent.replace(/\s+/g, ' ').trim());
          });
        }
      
        function setEditing(on) {
          editing = !!on;
          document.documentElement.setAttribute('data-editing', String(editing));
          if (editing) snapshot();
          editableNodes().forEach(function (el) {
            if (editing) {
              el.setAttribute('contenteditable', 'plaintext-only');
              el.setAttribute('spellcheck', 'false');
            } else {
              el.removeAttribute('contenteditable');
            }
          });
        }
      
        function locate(el) {
          if (el.hasAttribute('data-field')) {
            return { kind: 'field', field: el.getAttribute('data-field') };
          }
          var row = el.closest('[data-line]');
          if (row) {
            var rows = Array.prototype.slice.call(document.querySelectorAll('[data-line]'));
            return {
              kind: 'line',
              index: rows.indexOf(row),
              part: el.classList.contains('desc') ? 'desc' : 'item',
            };
          }
          return null;
        }
      
        document.addEventListener(
          'blur',
          function (e) {
            if (!editing) return;
            var el = e.target.closest && e.target.closest('[data-editable]');
            if (!el) return;
            var after = el.textContent.replace(/\s+/g, ' ').trim();
            if (committed.get(el) === after) return;
            committed.set(el, after);
            el.textContent = after;
            var where = locate(el);
            if (where) parent.postMessage({ type: 'dc:edited', where: where, value: after }, '*');
            report();
          },
          true,
        );
      
        document.addEventListener('keydown', function (e) {
          if (!editing) return;
          var el = e.target.closest && e.target.closest('[data-editable]');
          if (!el) return;
          // Enter commits: these are single-value fields, and a stray newline in a
          // project title is not a feature.
          if (e.key === 'Enter') {
            e.preventDefault();
            el.blur();
          }
          if (e.key === 'Escape') {
            e.preventDefault();
            if (committed.has(el)) el.textContent = committed.get(el);
            el.blur();
          }
        });
      
        function report() {
          var page = document.querySelector('.page');
          parent.postMessage(
            {
              type: 'dc:size',
              width: page ? page.offsetWidth : document.body.scrollWidth,
              height: page ? page.offsetHeight : document.body.scrollHeight,
            },
            '*',
          );
        }
      
        window.addEventListener('message', function (e) {
          if (!e.data) return;
          // A ping, answered with the same announcement sent at startup. The host
          // renders this frame on the server, so the document can finish loading —
          // and announce — before the host has attached its listener.
          if (e.data.type === 'dc:hello') parent.postMessage({ type: 'dc:ready' }, '*');
          if (e.data.type === 'dc:props') applyProps(e.data.props || {});
          if (e.data.type === 'dc:patch') applyPatch(e.data.ops);
          if (e.data.type === 'dc:edit') setEditing(e.data.editing);
          if (e.data.type === 'dc:print') window.print();
        });
      
        // Declared defaults, so the file is correct opened on its own.
        var block = document.querySelector('script[type="application/dc-props+json"]');
        var defaults = {};
        if (block) {
          try {
            var schema = JSON.parse(block.textContent);
            Object.keys(schema).forEach(function (k) {
              defaults[k] = schema[k].default;
            });
          } catch (err) {
            /* a malformed block must not blank the document */
          }
        }
        applyProps(defaults);
      
        // An exported copy carries the state it was exported in. It sits in <head>,
        // so it is already parsed by the time this runs at the end of <body>.
        var saved = document.querySelector('script[type="application/dc-state+json"]');
        if (saved) {
          try {
            var restored = JSON.parse(saved.textContent);
            if (restored.props) applyProps(restored.props);
            if (restored.ops && restored.ops.length) applyPatch(restored.ops);
          } catch (err) {
            /* a corrupt block leaves the document at its defaults, not blank */
          }
        }
      
        window.addEventListener('load', report);
        parent.postMessage({ type: 'dc:ready' }, '*');
      })();
    </script>
  </body>
</html>
