<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UI mockup</title>

    <!--
      A .dc.html artifact. Generated from artifacts/mockup.mjs — edit that,
      then run `npm run artifacts`.

      Three rules make the format work:
        1. It renders correctly on its own, from disk, with no host.
        2. It declares its own controls; the host builds the props bar from them.
        3. It owns its own arithmetic and layout logic.
    -->
    <script type="application/dc-props+json">
    {
          "device": {
                "type": "select",
                "label": "device",
                "default": "Desktop",
                "options": [
                      "Desktop",
                      "Tablet",
                      "Phone"
                ]
          },
          "theme": {
                "type": "select",
                "label": "theme",
                "default": "Dark",
                "options": [
                      "Dark",
                      "Light"
                ]
          },
          "accent": {
                "type": "select",
                "label": "accent",
                "default": "Indigo",
                "options": [
                      "Indigo",
                      "Forest",
                      "Oxide"
                ]
          },
          "showChrome": {
                "type": "boolean",
                "label": "showChrome",
                "default": true
          },
          "screenTitle": {
                "type": "text",
                "label": "screenTitle",
                "default": "Dashboard"
          }
    }
    </script>

    <style>
      :root {
        --ink: #17171a;
        --ink-soft: #55555c;
        --ink-faint: #8a8a92;
        --rule: #e2e2e6;
        --paper: #ffffff;

        --accent: #7b8fde;
        --ui-frame: #0e0e0e;
        --ui-panel: #141414;
        --ui-bg: #181818;
        --ui-card: #1e1e1e;
        --ui-border: #282828;
        --ui-text: #e8e8e8;
        --ui-muted: #858585;
        }

      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        background: var(--paper);
        color: var(--ink);
        font-family: Inter, system-ui, -apple-system, sans-serif;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
      }

      .page {
        width: 794px;
        min-height: 1123px;
        margin: 0 auto;
        padding: 56px 60px;
        display: flex;
        flex-direction: column;
      }

      /* Editable regions have to be findable before they are clicked, or the
         reader hunts for what the mode changed. */
      html[data-editing='true'] [data-editable] {
        outline: 1px dashed color-mix(in srgb, var(--accent) 45%, transparent);
        outline-offset: 3px;
        border-radius: 2px;
        cursor: text;
      }
      html[data-editing='true'] [data-editable]:hover { outline-style: solid; }
      html[data-editing='true'] [data-editable]:focus {
        outline: 2px solid var(--accent);
        background: color-mix(in srgb, var(--accent) 7%, transparent);
      }
      html[data-editing='true'] [data-editable]:empty::before {
        content: attr(data-placeholder);
        color: var(--ink-faint);
      }

      @media print {
        .page { width: auto; min-height: 0; padding: 0; }
      }

      html[data-accent='Forest'] { --accent: #4fca6e; }
      html[data-accent='Oxide']  { --accent: #d98a52; }

      /* The mockup's own palette flips with the theme prop — the point of a
         mockup is to see the screen in the mode it will ship in. */
      html[data-theme='Light'] {
        --ui-frame: #e7e7eb;
        --ui-panel: #f5f5f7;
        --ui-bg: #ffffff;
        --ui-card: #ffffff;
        --ui-border: #e8e8ec;
        --ui-text: #1e1e22;
        --ui-muted: #6c6c76;
      }
      html[data-theme='Light'][data-accent='Indigo'] { --accent: #4a5fbf; }

      .page { background: #ececef; align-items: center; justify-content: center; gap: 22px; }

      .caption { text-align: center; }
      .caption h1 { font-size: 21px; font-weight: 700; letter-spacing: -0.02em; }
      .caption p { margin-top: 5px; color: var(--ink-soft); font-size: 12.5px; }

      .device {
        width: 100%;
        background: var(--ui-frame);
        border-radius: 14px;
        padding: 10px;
        border: 1px solid rgba(0, 0, 0, 0.12);
      }
      html[data-device='Tablet'] .device { width: 76%; }
      html[data-device='Phone'] .device { width: 300px; border-radius: 26px; padding: 8px; }

      .titlebar { display: flex; align-items: center; gap: 6px; padding: 5px 8px 9px; }
      html:not([data-show-chrome='true']) .titlebar { display: none; }
      html[data-device='Phone'] .titlebar { display: none; }
      .titlebar i { width: 9px; height: 9px; border-radius: 50%; background: var(--ui-border); display: block; }

      .screen {
        display: grid;
        grid-template-columns: 150px minmax(0, 1fr);
        background: var(--ui-bg);
        border: 1px solid var(--ui-border);
        border-radius: 8px;
        overflow: hidden;
        min-height: 330px;
        color: var(--ui-text);
      }
      html[data-device='Phone'] .screen { grid-template-columns: minmax(0, 1fr); min-height: 460px; border-radius: 20px; }

      .rail { background: var(--ui-panel); border-right: 1px solid var(--ui-border); padding: 14px 10px; }
      html[data-device='Phone'] .rail { display: none; }
      .rail .brand { display: flex; align-items: center; gap: 7px; font-size: 11.5px; font-weight: 600; margin-bottom: 14px; }
      .rail .brand i { width: 16px; height: 9px; border: 2px solid var(--accent); border-radius: 999px; display: block; }
      .rail a { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; color: var(--ui-muted); font-size: 11px; }
      .rail a i { width: 5px; height: 5px; border-radius: 50%; background: currentColor; display: block; }
      .rail a[data-on='true'] { background: var(--ui-card); color: var(--ui-text); }
      .rail a[data-on='true'] i { background: var(--accent); }

      .main { padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; }
      .main h2 { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }

      .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
      html[data-device='Phone'] .tiles { grid-template-columns: repeat(2, 1fr); }
      .tile { background: var(--ui-card); border: 1px solid var(--ui-border); border-radius: 8px; padding: 11px 12px; }
      .tile b { display: block; font-size: 19px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
      .tile span { color: var(--ui-muted); font-size: 10px; }

      .list { background: var(--ui-card); border: 1px solid var(--ui-border); border-radius: 8px; overflow: hidden; }
      .list div { display: flex; justify-content: space-between; padding: 9px 12px; border-bottom: 1px solid var(--ui-border); font-size: 11.5px; }
      .list div:last-child { border-bottom: 0; }
      .list span:last-child { color: var(--ui-muted); font-variant-numeric: tabular-nums; }

      .cta { align-self: flex-start; padding: 7px 14px; background: var(--accent); color: var(--ui-frame); border-radius: 7px; font-size: 11.5px; font-weight: 500; }
  
    </style>
  </head>

  <body>
    <div class="page">
      <div class="caption">
        <h1 data-field="projectName" data-editable>Dashboard, dark</h1>
        <p data-field="projectNote" data-editable>Desktop shell with the compact side rail.</p>
      </div>

      <div class="device">
        <div class="titlebar"><i></i><i></i><i></i></div>
        <div class="screen">
          <nav class="rail">
            <p class="brand"><i></i>Loopable8</p>
            <a data-on="true"><i></i><span data-editable>Overview</span></a>
            <a><i></i><span data-editable>Projects</span></a>
            <a><i></i><span data-editable>Usage</span></a>
            <a><i></i><span data-editable>Settings</span></a>
          </nav>

          <div class="main">
            <h2 data-prop="screenTitle">Dashboard</h2>

            <div class="tiles">
              <div class="tile"><b data-editable>1,284</b><span data-editable>runs this month</span></div>
              <div class="tile"><b data-editable>98.2%</b><span data-editable>verified green</span></div>
              <div class="tile"><b data-editable>6s</b><span data-editable>median run</span></div>
            </div>

            <div class="list">
              <div><span data-editable>quotation.dc.html</span><span data-editable>2m ago</span></div>
              <div><span data-editable>resume.dc.html</span><span data-editable>19m ago</span></div>
              <div><span data-editable>tokens.json</span><span data-editable>1h ago</span></div>
            </div>

            <span class="cta" data-field="terms" data-editable>New project</span>
          </div>
        </div>
      </div>
    </div>
    <script>
      /**
       * The shared .dc.html runtime.
       *
       * Every artifact needs the same five things: apply props, apply patches, be
       * editable, restore an exported state, and answer the host's readiness ping.
       * Writing that six times would mean six chances for one of them to drift — and
       * the drift would be invisible, because each artifact only fails on its own page.
       *
       * It is inlined into each file rather than linked, because rule one of the
       * format is that an artifact renders on its own from disk with no host and no
       * network. A shared <script src> would break exactly that.
       *
       * An artifact that needs more — the quotation derives totals from its lines —
       * defines `window.DC_HOOKS = { render, patch }` before this runs.
       */
      (function () {
        var props = {};
        var editing = false;
        var committed = new Map();
        var hooks = window.DC_HOOKS || {};
      
        function kebab(s) {
          return s.replace(/([a-z0-9])([A-Z])/g, '$1-$2').toLowerCase();
        }
      
        function editableNodes() {
          return Array.prototype.slice.call(document.querySelectorAll('[data-editable]'));
        }
      
        function render() {
          // Any element bound to a prop shows that prop's value.
          document.querySelectorAll('[data-prop]').forEach(function (el) {
            var key = el.getAttribute('data-prop');
            if (typeof props[key] === 'string') el.textContent = props[key];
          });
          if (hooks.render) hooks.render(props);
          report();
        }
      
        function applyProps(next) {
          Object.keys(next).forEach(function (k) {
            props[k] = next[k];
            document.documentElement.setAttribute('data-' + kebab(k), String(next[k]));
          });
          render();
        }
      
        function setCommitted(el, value) {
          if (committed.has(el)) committed.set(el, value);
        }
      
        function applyPatch(ops) {
          (ops || []).forEach(function (op) {
            if (op.op === 'setProp') {
              props[op.key] = op.value;
              document.documentElement.setAttribute('data-' + kebab(op.key), String(op.value));
            } else if (op.op === 'setField') {
              var el = document.querySelector('[data-field="' + op.field + '"]');
              if (el) {
                el.textContent = op.value;
                setCommitted(el, op.value);
              }
            } else if (hooks.patch) {
              hooks.patch(op, { setCommitted: setCommitted });
            }
          });
          render();
        }
      
        // ── Edit mode ──
        //
        // The baseline is taken when edit mode opens, not on focus. Keying it to a
        // focus event means any path into a field that does not fire one leaves
        // nothing to compare against, and the blur handler discards what was typed.
      
        function snapshot() {
          committed.clear();
          editableNodes().forEach(function (el) {
            committed.set(el, el.textContent.replace(/\s+/g, ' ').trim());
          });
        }
      
        function setEditing(on) {
          editing = !!on;
          document.documentElement.setAttribute('data-editing', String(editing));
          if (editing) snapshot();
          editableNodes().forEach(function (el) {
            if (editing) {
              el.setAttribute('contenteditable', 'plaintext-only');
              el.setAttribute('spellcheck', 'false');
            } else {
              el.removeAttribute('contenteditable');
            }
          });
        }
      
        function locate(el) {
          if (el.hasAttribute('data-field')) {
            return { kind: 'field', field: el.getAttribute('data-field') };
          }
          var row = el.closest('[data-line]');
          if (row) {
            var rows = Array.prototype.slice.call(document.querySelectorAll('[data-line]'));
            return {
              kind: 'line',
              index: rows.indexOf(row),
              part: el.classList.contains('desc') ? 'desc' : 'item',
            };
          }
          return null;
        }
      
        document.addEventListener(
          'blur',
          function (e) {
            if (!editing) return;
            var el = e.target.closest && e.target.closest('[data-editable]');
            if (!el) return;
            var after = el.textContent.replace(/\s+/g, ' ').trim();
            if (committed.get(el) === after) return;
            committed.set(el, after);
            el.textContent = after;
            var where = locate(el);
            if (where) parent.postMessage({ type: 'dc:edited', where: where, value: after }, '*');
            report();
          },
          true,
        );
      
        document.addEventListener('keydown', function (e) {
          if (!editing) return;
          var el = e.target.closest && e.target.closest('[data-editable]');
          if (!el) return;
          // Enter commits: these are single-value fields, and a stray newline in a
          // project title is not a feature.
          if (e.key === 'Enter') {
            e.preventDefault();
            el.blur();
          }
          if (e.key === 'Escape') {
            e.preventDefault();
            if (committed.has(el)) el.textContent = committed.get(el);
            el.blur();
          }
        });
      
        function report() {
          var page = document.querySelector('.page');
          parent.postMessage(
            {
              type: 'dc:size',
              width: page ? page.offsetWidth : document.body.scrollWidth,
              height: page ? page.offsetHeight : document.body.scrollHeight,
            },
            '*',
          );
        }
      
        window.addEventListener('message', function (e) {
          if (!e.data) return;
          // A ping, answered with the same announcement sent at startup. The host
          // renders this frame on the server, so the document can finish loading —
          // and announce — before the host has attached its listener.
          if (e.data.type === 'dc:hello') parent.postMessage({ type: 'dc:ready' }, '*');
          if (e.data.type === 'dc:props') applyProps(e.data.props || {});
          if (e.data.type === 'dc:patch') applyPatch(e.data.ops);
          if (e.data.type === 'dc:edit') setEditing(e.data.editing);
          if (e.data.type === 'dc:print') window.print();
        });
      
        // Declared defaults, so the file is correct opened on its own.
        var block = document.querySelector('script[type="application/dc-props+json"]');
        var defaults = {};
        if (block) {
          try {
            var schema = JSON.parse(block.textContent);
            Object.keys(schema).forEach(function (k) {
              defaults[k] = schema[k].default;
            });
          } catch (err) {
            /* a malformed block must not blank the document */
          }
        }
        applyProps(defaults);
      
        // An exported copy carries the state it was exported in. It sits in <head>,
        // so it is already parsed by the time this runs at the end of <body>.
        var saved = document.querySelector('script[type="application/dc-state+json"]');
        if (saved) {
          try {
            var restored = JSON.parse(saved.textContent);
            if (restored.props) applyProps(restored.props);
            if (restored.ops && restored.ops.length) applyPatch(restored.ops);
          } catch (err) {
            /* a corrupt block leaves the document at its defaults, not blank */
          }
        }
      
        window.addEventListener('load', report);
        parent.postMessage({ type: 'dc:ready' }, '*');
      })();
    </script>
  </body>
</html>
